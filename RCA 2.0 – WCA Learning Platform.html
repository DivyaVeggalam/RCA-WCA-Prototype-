<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>RCA 2.0 – WCA Learning Platform</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Lexend:wght@300;400;500;600&display=swap">
<style>
/* Layout: fixed top bar + module sidebar + full-width work area; split panes for activities. Single light pastel theme by design (brief forbids dark UI). */
:root{
  color-scheme: light;
  --bg:#F5F8FE; --surface:#FFFFFF; --surface-2:#FAFBFF;
  --ink:#2B3247; --ink-2:#5A627A; --ink-3:#8A91A6; --line:#E2E7F3; --line-2:#EEF1F8;
  --blue:#4A6FD6; --blue-ink:#3557B8; --blue-50:#EAF0FF; --blue-100:#D9E4FF;
  --sky:#E2F4FD; --sky-ink:#2A7FA8;
  --mint:#DFF5EA; --mint-ink:#26845A;
  --violet:#ECE6FD; --violet-ink:#6450C4;
  --lav:#F4F0FF;
  --aqua:#DAF4F2; --aqua-ink:#1F7F79;
  --peach:#FFEADF; --peach-ink:#B85A30;
  --good:#E0F5EA; --good-ink:#1F7A50; --try:#FFF1DE; --try-ink:#9A5A12;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Lexend","Segoe UI",system-ui,-apple-system,sans-serif;
  --r-sm:8px; --r:14px; --r-lg:20px;
  --shadow:0 1px 2px rgba(60,80,140,.06),0 8px 24px rgba(60,80,140,.07);
  --hdr:66px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;font-weight:400;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);color:var(--ink);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,2.4vw,2.2rem);font-weight:700}
h2{font-size:clamp(1.3rem,1.8vw,1.6rem);font-weight:700}
h3{font-size:1.15rem;font-weight:600}
h4{font-size:1rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue-ink)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.mono,.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.small{font-size:.85rem}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Buttons & pills ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:10px 20px;font-weight:500;font-size:.95rem;background:var(--blue);color:#fff;transition:transform .15s,box-shadow .15s,background .15s;white-space:nowrap}
.btn:hover{background:var(--blue-ink);box-shadow:0 6px 16px rgba(74,111,214,.25)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.soft{background:var(--blue-50);color:var(--blue-ink)}
.btn.soft:hover{background:var(--blue-100);box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink);box-shadow:none}
.btn.mint{background:var(--mint-ink)}
.btn.mint:hover{background:#1d6d49}
.btn.sm{padding:6px 14px;font-size:.85rem}
.btn.lg{padding:13px 26px;font-size:1rem}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;font-size:.78rem;font-weight:500;background:var(--blue-50);color:var(--blue-ink);white-space:nowrap}
.pill.mint{background:var(--mint);color:var(--mint-ink)}.pill.violet{background:var(--violet);color:var(--violet-ink)}
.pill.aqua{background:var(--aqua);color:var(--aqua-ink)}.pill.peach{background:var(--peach);color:var(--peach-ink)}
.pill.sky{background:var(--sky);color:var(--sky-ink)}.pill.grey{background:var(--line-2);color:var(--ink-2)}
.pill.proto{background:var(--try);color:var(--try-ink)}

/* ---------- Login ---------- */
#login{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{position:relative;overflow:hidden;background:linear-gradient(150deg,#E6EEFF 0%,#EDE7FE 55%,#DDF4F1 100%);padding:48px max(32px,env(safe-area-inset-left,0px)) 40px;display:flex;flex-direction:column;gap:28px}
.login-art .brand-row{display:flex;align-items:center;gap:14px}
.login-art h1{font-size:clamp(2rem,3.6vw,3.2rem);font-weight:800;letter-spacing:-.02em;max-width:14ch}
.login-art h1 span{color:var(--blue-ink)}
.expand{display:grid;gap:10px;max-width:520px}
.expand div{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.9);padding:10px 14px;border-radius:var(--r)}
.expand b{font-family:var(--display);font-size:1.05rem;min-width:52px;color:var(--violet-ink)}
.expand div:first-child b{color:var(--blue-ink)}
.quote{max-width:520px;font-size:1.05rem;font-style:italic;color:var(--ink);border-left:3px solid var(--violet-ink);padding-left:16px}
.login-illus{flex:1;display:flex;align-items:flex-end;justify-content:center;min-height:220px}
.login-illus svg{width:100%;max-width:560px;height:auto}
.login-form-wrap{display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));background:var(--surface)}
.login-form{width:100%;max-width:430px;display:grid;gap:18px}
.login-form h2{font-size:1.8rem}
.field{display:grid;gap:6px}
.field label{font-weight:500;font-size:.9rem}
.input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface-2);transition:border-color .15s,background .15s}
.input:focus{outline:none;border-color:var(--blue);background:#fff}
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:84px}
.pw-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:var(--blue-50);color:var(--blue-ink);border-radius:8px;padding:5px 10px;font-size:.8rem}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem}
.check input{width:17px;height:17px;accent-color:var(--blue)}
.linkbtn{border:0;background:none;color:var(--blue-ink);padding:0;font-size:.9rem;text-decoration:underline;text-underline-offset:3px}
.demo-cred{background:var(--sky);border-radius:var(--r);padding:12px 14px;font-size:.88rem;display:grid;gap:4px}
.demo-cred code{font-family:var(--body);font-weight:600;color:var(--sky-ink)}
.form-msg{min-height:22px;font-size:.88rem}
.form-msg.err{color:var(--peach-ink)}
.form-msg.ok{color:var(--mint-ink)}

/* ---------- App shell ---------- */
#shell{min-height:100%;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;height:var(--hdr);background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;flex:none;border:0;background:none;padding:0}
.logo svg{height:42px;width:auto;display:block}
.nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:transparent;padding:9px 16px;border-radius:999px;font-weight:500;color:var(--ink-2);white-space:nowrap;transition:background .15s,color .15s}
.nav button:hover{background:var(--blue-50);color:var(--ink)}
.nav button.on{background:var(--blue-50);color:var(--blue-ink)}
.top-actions{display:flex;align-items:center;gap:6px;flex:none}
.icon-btn{position:relative;width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--blue-50);color:var(--blue-ink)}
.icon-btn svg{width:21px;height:21px}
.dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--peach-ink);border:2px solid #fff}
.profile{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:.85rem;background:linear-gradient(135deg,var(--violet),var(--aqua));color:var(--violet-ink)}
.profile .who{display:grid;line-height:1.15;text-align:left}
.profile .who b{font-size:.88rem;font-weight:600}.profile .who span{font-size:.74rem;color:var(--ink-2)}
.dropdown{position:absolute;top:calc(var(--hdr) - 4px);right:max(18px,env(safe-area-inset-right,0px));width:330px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:10px;z-index:70;display:grid;gap:4px}
.dropdown .dd-item{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:0;background:transparent;border-radius:10px;padding:10px}
.dropdown .dd-item:hover{background:var(--surface-2)}
.dd-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.body{flex:1;display:flex;min-height:0}
.sidebar{width:272px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:18px 12px 24px;position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top,0px));height:calc(100vh - var(--hdr));overflow-y:auto}
.sidebar.hidden-side{display:none}
.side-head{padding:6px 10px 14px;display:grid;gap:8px}
.side-head .meter{height:7px;border-radius:9px;background:var(--line-2);overflow:hidden}
.side-head .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--violet-ink))}
.side-group{padding:12px 10px 4px;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.side-item{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:10px;color:var(--ink-2);font-size:.9rem;transition:background .12s}
.side-item:hover{background:var(--surface-2);color:var(--ink)}
.side-item.on{background:var(--blue-50);color:var(--blue-ink);font-weight:500}
.side-item.sub{padding-left:34px;font-size:.85rem}
.side-item.offpath{opacity:.55}
.side-item .st{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;border:1.5px solid var(--line);font-size:.68rem;color:var(--ink-3);background:#fff}
.side-item .st.ok{background:var(--mint);border-color:var(--mint);color:var(--mint-ink)}
.side-item .st svg{width:12px;height:12px}
.side-item .lbl{flex:1;min-width:0}
.main{flex:1;min-width:0;padding-block:26px 90px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.page{display:grid;gap:22px;animation:rise .35s ease both}
@keyframes rise{from{transform:translateY(8px)}to{transform:none}}
.crumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem;color:var(--ink-2)}
.crumbs b{color:var(--ink);font-weight:500}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-head .t{display:grid;gap:6px;min-width:0}
.page-head .t p{color:var(--ink-2);max-width:70ch}

/* ---------- Cards & grids ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px}
.card.tint-blue{background:var(--blue-50);border-color:transparent}.card.tint-mint{background:var(--mint);border-color:transparent}
.card.tint-violet{background:var(--violet);border-color:transparent}.card.tint-aqua{background:var(--aqua);border-color:transparent}
.card.tint-peach{background:var(--peach);border-color:transparent}.card.tint-sky{background:var(--sky);border-color:transparent}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.split-wide{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,1fr);gap:20px;align-items:start}
.stack{display:grid;gap:12px}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.instr{display:flex;gap:12px;align-items:flex-start;background:var(--sky);border-radius:var(--r);padding:12px 16px;font-size:.92rem}
.instr svg{width:22px;height:22px;flex:none;color:var(--sky-ink);margin-top:1px}
.instr b{color:var(--sky-ink)}

/* ---------- Dashboard ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:stretch}
.welcome{background:linear-gradient(120deg,var(--blue-50),var(--lav) 60%,var(--aqua));border-radius:var(--r-lg);padding:26px 28px;display:flex;gap:20px;align-items:center;justify-content:space-between;overflow:hidden}
.welcome .t{display:grid;gap:8px;min-width:0}
.welcome > svg{width:190px;flex:none;height:auto}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:4px}
.stat .v{font-family:var(--display);font-size:1.9rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat .k{font-size:.8rem;color:var(--ink-2)}
.stat .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-bottom:6px}
.stat .ic svg{width:19px;height:19px}
.continue{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--blue) calc(var(--p)*1%),var(--line-2) 0);display:grid;place-items:center;flex:none}
.ring>span{width:74%;height:74%;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.2rem;font-variant-numeric:tabular-nums}
.ring.big{width:150px;height:150px}.ring.big>span{font-size:2rem}
.course-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.course{border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:12px;border:1px solid transparent;transition:transform .2s,box-shadow .2s}
.course:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.course .art{height:120px;border-radius:14px;background:rgba(255,255,255,.6);display:grid;place-items:center}
.course .art svg{height:96px;width:auto}
.course p{font-size:.88rem;color:var(--ink-2)}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.8);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:currentColor;transition:width .5s}
.course .btns{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.chart-bars{display:grid;gap:12px}
.cb-row{display:grid;grid-template-columns:130px minmax(0,1fr) 44px;gap:12px;align-items:center;font-size:.88rem}
.cb-track{height:22px;border-radius:8px;background:var(--line-2);overflow:hidden}
.cb-track i{display:block;height:100%;border-radius:8px;background:var(--blue-100);transition:width .8s}
.cb-row.you .cb-track i{background:linear-gradient(90deg,var(--blue),var(--violet-ink))}
.cb-row.you{font-weight:600}
.cb-row .n{text-align:right;font-variant-numeric:tabular-nums}
.week-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:150px;padding-top:10px}
.wb{display:grid;gap:6px;justify-items:center;height:100%;align-content:end}
.wb i{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:var(--aqua);display:block}
.wb.today i{background:var(--aqua-ink)}
.wb span{font-size:.75rem;color:var(--ink-2)}
.goal-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.goal{border-radius:var(--r);padding:12px;display:grid;gap:6px;justify-items:center;text-align:center;font-size:.82rem;border:1.5px dashed var(--line)}
.goal.done{border-style:solid;border-color:transparent;background:var(--mint)}
.goal .gi{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--line-2);color:var(--ink-3)}
.goal.done .gi{background:#fff;color:var(--mint-ink)}
.goal .gi svg{width:18px;height:18px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.badge{border-radius:var(--r);padding:14px 12px;display:grid;justify-items:center;text-align:center;gap:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:transform .15s}
.badge:hover{transform:translateY(-2px)}
.badge > svg{width:70px;height:70px}
.badge b{font-size:.86rem;font-weight:600;line-height:1.25}
.badge span{font-size:.74rem;color:var(--ink-2);line-height:1.35}
.badge.locked{background:var(--surface-2)}
.badge.locked > svg{filter:grayscale(1);opacity:.45}
.badge.locked b{color:var(--ink-3)}

/* ---------- Module landing ---------- */
.module-hero{border-radius:var(--r-lg);padding:28px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.module-hero svg.hero-art{width:220px;height:auto}
.module-hero .t{display:grid;gap:10px}
.level-card{display:grid;gap:14px;align-content:start}
.level-card ol{margin:0;padding-left:20px;display:grid;gap:3px;font-size:.9rem;color:var(--ink-2)}
.journey{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.step{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;display:grid;gap:6px;text-align:left;transition:border-color .15s,transform .15s}
.step:hover{border-color:var(--blue);transform:translateY(-2px)}
.step .n{font-family:var(--display);font-weight:700;color:var(--ink-3);font-size:.85rem}
.step.done{background:var(--mint);border-color:transparent}
.step.done .n{color:var(--mint-ink)}
.step b{font-weight:500;font-size:.92rem}

/* ---------- Flashcards ---------- */
.fc-stage{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:20px}
.flip{perspective:1400px;min-height:400px;cursor:pointer}
.flip-inner{position:relative;width:100%;height:100%;min-height:400px;transition:transform .6s;transform-style:preserve-3d}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r-lg);padding:30px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.face.front{background:linear-gradient(140deg,var(--blue-50),var(--violet));align-items:center;justify-content:center;text-align:center}
.face.back{background:var(--surface);border:1px solid var(--line);transform:rotateY(180deg)}
.fc-word{font-family:var(--display);font-size:clamp(2.4rem,5vw,4rem);font-weight:800;letter-spacing:-.02em}
.phon{font-size:1.15rem;color:var(--violet-ink)}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 14px;font-size:.93rem}
.kv dt{color:var(--ink-2);font-weight:500}.kv dd{margin:0}
.root-chip{display:inline-flex;gap:8px;align-items:center;background:var(--aqua);color:var(--aqua-ink);border-radius:10px;padding:6px 12px;font-weight:500}
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dots button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:.72rem;color:var(--ink-2);padding:0}
.dots button.cur{border-color:var(--blue);color:var(--blue-ink);font-weight:600}
.dots button.ok{background:var(--mint);border-color:var(--mint);color:var(--mint-ink)}
table.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{background:var(--blue-50);color:var(--blue-ink);text-align:left;font-weight:600;padding:10px 12px}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr:nth-child(even) td{background:var(--surface-2)}
.tbl-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line)}

/* ---------- Quiz ---------- */
.quiz{display:grid;gap:16px}
.qbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.qbar .progress{flex:1;min-width:160px;height:10px;border-radius:9px;background:var(--line-2);overflow:hidden}
.qbar .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--violet-ink));transition:width .3s}
.chip-stat{display:inline-flex;gap:6px;align-items:center;font-size:.85rem;font-weight:500;padding:6px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.chip-stat.timer.low{background:var(--try);color:var(--try-ink);border-color:transparent}
.qgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:18px;align-items:start}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px;display:grid;gap:18px;min-height:420px;align-content:start}
.qnum{font-family:var(--display);font-weight:700;color:var(--blue-ink)}
.qtext{font-size:1.22rem;font-weight:500;line-height:1.5}
.qtext em{font-style:italic}
.qtext mark,.ctx mark{background:var(--violet);color:var(--violet-ink);padding:0 5px;border-radius:5px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface-2);border-radius:14px;padding:14px 16px;transition:border-color .15s,background .15s;font-size:1rem}
.opt:hover:not(:disabled){border-color:var(--blue);background:#fff}
.opt .L{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);font-weight:600;font-size:.85rem;flex:none}
.opt.sel{border-color:var(--blue);background:var(--blue-50)}
.opt.sel .L{background:var(--blue);color:#fff;border-color:var(--blue)}
.opt.right{border-color:var(--good-ink);background:var(--good)}
.opt.right .L{background:var(--good-ink);color:#fff;border-color:var(--good-ink)}
.opt.wrong{border-color:var(--try-ink);background:var(--try)}
.opt:disabled{cursor:default}
.opts.yn{grid-template-columns:repeat(2,minmax(0,220px))}
.opts.yn .opt{justify-content:center;font-weight:600;font-size:1.05rem}
.bracket{font-size:1.25rem;line-height:2.1}
.bracket .bopts{display:inline-flex;gap:6px;flex-wrap:wrap;vertical-align:middle}
.bopt{border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:2px 12px;font-size:1.05rem}
.bopt.sel{border-color:var(--blue);background:var(--blue-50);color:var(--blue-ink);font-weight:500}
.bopt.right{border-color:var(--good-ink);background:var(--good)}.bopt.wrong{border-color:var(--try-ink);background:var(--try)}
.feedback{border-radius:14px;padding:14px 16px;display:grid;gap:6px;font-size:.95rem;animation:rise .25s ease}
.feedback.good{background:var(--good);color:var(--good-ink)}
.feedback.try{background:var(--try);color:#6d4210}
.feedback b{font-family:var(--display);font-size:1.05rem}
.qactions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:auto}
.side-panel{display:grid;gap:14px}
.helpbox{border-radius:var(--r-lg);padding:20px;display:grid;gap:10px}
.helpbox svg.ill{width:100%;max-height:150px}
.qmap{display:flex;flex-wrap:wrap;gap:6px}
.qmap button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:.8rem;padding:0}
.qmap button.cur{border-color:var(--blue);color:var(--blue-ink);font-weight:600}
.qmap button.ok{background:var(--good);border-color:transparent;color:var(--good-ink)}
.qmap button.no{background:var(--try);border-color:transparent;color:var(--try-ink)}
.qmap button.ans{background:var(--blue-50);border-color:transparent}
.hint{background:var(--lav);border-radius:12px;padding:12px 14px;font-size:.9rem;color:var(--violet-ink)}
.type-in{max-width:420px}
.passage-box{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;font-size:.95rem;max-height:240px;overflow:auto}

/* ---------- Results ---------- */
.results{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.res-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.res-stats div{background:var(--surface-2);border-radius:12px;padding:12px;display:grid}
.res-stats b{font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.res-stats span{font-size:.8rem;color:var(--ink-2)}
.improve{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}

/* ---------- Drag & drop ---------- */
.dnd-bank{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:12px;border-radius:var(--r);background:var(--surface-2);border:1.5px dashed var(--line);align-content:flex-start}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:10px;background:var(--surface);border:1.5px solid var(--blue-100);font-size:.92rem;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:transform .12s,box-shadow .12s,border-color .12s}
.chip:hover{border-color:var(--blue)}
.chip.picked{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-100);transform:translateY(-1px)}
.chip.dragging{opacity:.4}
.chip.right{background:var(--good);border-color:var(--good-ink)}
.chip.wrong{background:var(--try);border-color:var(--try-ink)}
.chip .x{border:0;background:none;padding:0 0 0 4px;color:var(--ink-3);font-size:1rem;line-height:1}
.zone{transition:background .12s,border-color .12s}
.zone.over{background:var(--blue-50)!important;border-color:var(--blue)!important}
.slot{display:inline-flex;min-width:130px;min-height:36px;vertical-align:middle;border-bottom:2px dashed var(--blue-100);border-radius:8px 8px 0 0;padding:2px 4px;align-items:center;justify-content:center;background:var(--surface-2);margin:0 4px}
.slot:empty::before{content:"drop here";font-size:.75rem;color:var(--ink-3)}
.slot .chip{margin:0}
.sent-list{display:grid;gap:10px;counter-reset:s}
.sent{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:1rem;line-height:2.1}
.sent::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:8px;background:var(--blue-50);color:var(--blue-ink);display:grid;place-items:center;font-size:.8rem;font-weight:600;flex:none;line-height:1}
.sent.ok{border-color:var(--good-ink);background:var(--good)}
.sent.no{border-color:var(--try-ink);background:var(--try)}
.sent .why{flex-basis:100%;font-size:.85rem;color:#6d4210;line-height:1.4}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.bucket{border-radius:var(--r);padding:12px;min-height:170px;display:flex;flex-direction:column;gap:8px;border:1.5px solid transparent}
.bucket h4{font-size:.95rem}
.bucket .zone{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;border-radius:10px;padding:8px;background:rgba(255,255,255,.65);border:1.5px dashed rgba(90,100,140,.2);min-height:90px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:10px;color:var(--ink-2);font-weight:500;display:flex;gap:8px;align-items:center}
.tab:hover{background:var(--surface-2)}
.tab.on{background:var(--blue-50);color:var(--blue-ink)}
.tab .st{width:18px;height:18px;border-radius:50%;background:var(--line-2);display:grid;place-items:center;font-size:.65rem}
.tab .st.ok{background:var(--mint);color:var(--mint-ink)}
.circles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.circle{aspect-ratio:1;max-width:100%;border-radius:50%;background:conic-gradient(var(--blue-50) 0 25%,var(--violet) 0 50%,var(--aqua) 0 75%,var(--mint) 0);position:relative;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;padding:12%;font-size:.88rem;font-weight:500}
.circle>span{display:grid;place-items:center;text-align:center}
.circle .zone{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:48%;min-height:52px;background:#fff;border-radius:14px;border:1.5px dashed var(--blue-100);display:grid;place-items:center;padding:4px}
.circle .zone:empty::before{content:"concept?";font-size:.75rem;color:var(--ink-3)}
.odd-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.odd-row .w{border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px 14px}
.odd-row .w.sel{border-color:var(--blue);background:var(--blue-50);color:var(--blue-ink)}
.odd-row .w.right{border-color:var(--good-ink);background:var(--good)}
.odd-row .w.wrong{border-color:var(--try-ink);background:var(--try)}
.match{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(240px,1fr);gap:18px;align-items:start}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.mrow .zone{min-height:44px;border-radius:10px;border:1.5px dashed var(--blue-100);background:var(--surface-2);display:flex;align-items:center;padding:4px}
.mrow .zone:empty::before{content:"drag the matching part here";font-size:.78rem;color:var(--ink-3);padding-left:6px}
.mrow.ok{border-color:var(--good-ink)}.mrow.no{border-color:var(--try-ink)}

/* ---------- Clickable paragraph & table ---------- */
.para-click{font-size:1.12rem;line-height:2.1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:26px}
.para-click .w{border-radius:5px;padding:2px 1px;cursor:pointer;transition:background .12s}
.para-click .w:hover{background:var(--blue-50)}
.para-click .w.sel{background:var(--violet);color:var(--violet-ink);font-weight:500}
.para-click .w.right{background:var(--good);color:var(--good-ink)}
.para-click .w.wrong{background:var(--try);color:var(--try-ink)}
.para-click .w.missed{outline:2px dashed var(--good-ink)}
.fill-tbl td,.fill-tbl th{text-align:center;min-width:96px}
.fill-tbl input{width:100%;min-width:80px;border:1.5px solid var(--blue-100);border-radius:8px;padding:6px;text-align:center;background:#fff}
.fill-tbl input.ok{border-color:var(--good-ink);background:var(--good)}
.fill-tbl input.no{border-color:var(--try-ink);background:var(--try)}

/* ---------- Writing ---------- */
.prompt-card{background:linear-gradient(120deg,var(--violet),var(--blue-50));border-radius:var(--r-lg);padding:20px 24px;display:grid;gap:8px}
.prompt-card ul{margin:0;padding-left:20px}
.writer{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr);gap:18px;align-items:start}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:grid}
.paper textarea{border:0;resize:vertical;min-height:420px;padding:22px 26px 22px 66px;line-height:32px;font-size:1.02rem;background:linear-gradient(90deg,transparent 52px,#F3C9C0 52px,#F3C9C0 54px,transparent 54px),repeating-linear-gradient(#fff 0 31px,#E4EAF6 31px 32px);background-attachment:local;outline:none}
.paper .wbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding:12px 16px;background:var(--surface-2)}
.wc{font-variant-numeric:tabular-nums;font-weight:500}
.wc.ok{color:var(--good-ink)}.wc.low{color:var(--try-ink)}
.preview{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;line-height:1.9;white-space:pre-wrap}
.preview mark{background:var(--mint);color:var(--mint-ink);border-radius:4px;padding:0 3px}
.bank-list{display:flex;flex-wrap:wrap;gap:6px}
.bank-list span{font-size:.85rem;padding:4px 10px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line)}
.bank-list span.used{background:var(--mint);border-color:transparent;color:var(--mint-ink);text-decoration:line-through;text-decoration-thickness:1px}
.rubric{display:grid;gap:10px}
.rub{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 12px;background:var(--surface-2);border-radius:12px}
.rub .pips{display:flex;gap:4px}
.rub .pips i{width:16px;height:8px;border-radius:4px;background:var(--line)}
.rub .pips i.on{background:var(--violet-ink)}
.rub p{grid-column:1/-1;font-size:.85rem;color:var(--ink-2)}
.fb-list{margin:0;padding-left:20px;display:grid;gap:6px;font-size:.92rem}

/* ---------- Checklist ---------- */
.cl{display:grid;gap:10px}
.cl-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.cl-row .n{width:30px;height:30px;border-radius:9px;background:var(--blue-50);color:var(--blue-ink);display:grid;place-items:center;font-weight:600;font-size:.85rem}
.yn{display:flex;gap:6px}
.yn button{border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px 16px;font-weight:500}
.yn button.y.on{background:var(--good);border-color:var(--good-ink);color:var(--good-ink)}
.yn button.n.on{background:var(--try);border-color:var(--try-ink);color:var(--try-ink)}

/* ---------- Video ---------- */
.video{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(260px,1fr);gap:18px;align-items:start}
.player{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.screen{position:relative;aspect-ratio:16/9;max-width:100%;background:linear-gradient(135deg,#EEF3FF,#F1ECFE 60%,#E4F6F3);display:grid;place-items:center;overflow:hidden}
.scene{position:absolute;inset:0;display:grid;place-items:center;padding:6%;text-align:center;animation:fadeIn .5s ease}
@keyframes fadeIn{from{opacity:.2;transform:scale(.98)}to{opacity:1;transform:none}}
.scene h3{font-size:clamp(1.2rem,2.6vw,2.1rem);font-weight:700}
.scene .big{font-family:var(--display);font-size:clamp(1rem,2vw,1.6rem);font-weight:600}
.scene .formula{display:inline-flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.scene .formula span{background:#fff;border-radius:10px;padding:8px 14px;font-weight:500;box-shadow:var(--shadow)}
.playover{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.35);border:0}
.playover span{width:78px;height:78px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow);color:var(--blue)}
.playover svg{width:34px;height:34px;margin-left:5px}
.caption{position:absolute;left:5%;right:5%;bottom:5%;background:rgba(255,255,255,.92);border-radius:10px;padding:8px 14px;font-size:.92rem;text-align:center}
.vctrl{display:flex;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap}
.vctrl input[type=range]{flex:1;min-width:120px;accent-color:var(--blue)}
.vctrl select{border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:#fff}
.chapters{display:grid;gap:6px}
.chap{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center;text-align:left;border:0;background:transparent;border-radius:10px;padding:8px 10px}
.chap:hover{background:var(--surface-2)}
.chap.on{background:var(--blue-50);color:var(--blue-ink)}
.chap .tm{font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--ink-2)}

/* ---------- Textbook ---------- */
.book{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
.toc{position:sticky;top:calc(var(--hdr) + 20px);display:grid;gap:4px;font-size:.86rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.toc a{text-decoration:none;color:var(--ink-2);padding:5px 8px;border-radius:8px}
.toc a:hover{background:var(--surface-2);color:var(--ink)}
.textbook{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(20px,3vw,40px);display:grid;gap:18px;max-width:900px}
.textbook section{display:grid;gap:12px;scroll-margin-top:calc(var(--hdr) + 16px)}
.textbook p,.textbook li{max-width:72ch}
.textbook ul,.textbook ol{margin:0;padding-left:22px;display:grid;gap:6px}
.rule{border-radius:14px;padding:16px 18px;background:var(--violet);display:grid;gap:6px}
.rule .eyebrow{color:var(--violet-ink)}
.rule .f{font-family:var(--display);font-size:1.25rem;font-weight:600}
.ex{border-left:3px solid var(--aqua-ink);background:var(--aqua);border-radius:0 12px 12px 0;padding:12px 16px;display:grid;gap:4px}
.ex .s{font-size:1.05rem}
.note{background:var(--peach);border-radius:12px;padding:12px 16px;font-size:.93rem;color:#6b3418}
.recap{background:var(--mint);border-radius:14px;padding:16px 20px}
.recap ul{color:#1d5e40}
.lead{font-size:1.12rem;color:var(--ink)}
.u{text-decoration:underline;text-decoration-color:var(--violet-ink);text-decoration-thickness:2px;text-underline-offset:3px}
.kw{background:var(--blue-50);color:var(--blue-ink);padding:0 5px;border-radius:5px;font-weight:500}
.figure{display:grid;gap:8px;justify-items:center;background:var(--surface-2);border-radius:14px;padding:16px}
.figure svg{max-width:100%;height:auto}
.figure figcaption{font-size:.82rem;color:var(--ink-2)}

/* ---------- Letter / format ---------- */
.letter{background:#FFFEFB;border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:clamp(18px,3vw,36px);font-size:.95rem;line-height:1.7;display:grid;gap:12px;position:relative}
.letter .tag{position:absolute;left:-10px;transform:translateX(-100%);font-size:.7rem}
.letter .blk{border-radius:6px;padding:2px 6px;transition:background .2s}
.letter .blk.hl{background:var(--violet)}
.format-map{display:grid;gap:8px}
.fm{display:flex;align-items:center;gap:10px;border-radius:10px;padding:10px 12px;border:1.5px solid transparent;cursor:pointer;font-size:.9rem;background:var(--surface)}
.fm:hover,.fm.on{border-color:var(--violet-ink);background:var(--lav)}
.fm i{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-weight:600;font-size:.78rem;background:var(--violet);color:var(--violet-ink);flex:none}
.sheet{background:#fff;border-radius:6px;border:1px solid var(--line);box-shadow:var(--shadow);padding:22px 20px 22px 64px;position:relative;background-image:linear-gradient(90deg,transparent 48px,#F3C9C0 48px,#F3C9C0 50px,transparent 50px);display:grid;gap:0}
.sheet .line{min-height:48px;border-bottom:1.5px solid #DCE4F4;display:flex;align-items:center;padding:4px 0;position:relative}
.sheet .line::before{content:attr(data-n);position:absolute;left:-46px;font-size:.72rem;color:var(--ink-3)}
.sheet .line .chip{background:transparent;border-color:transparent;box-shadow:none;padding:4px 6px;font-family:var(--body)}
.sheet .line:empty::after{content:"";}
.note-chip{background:#FFF8D6;border-color:#F1E3A0;transform:rotate(-.6deg);box-shadow:0 2px 4px rgba(120,100,40,.12)}
.note-chip:nth-child(3n){background:#E5F6EE;border-color:#BFE6D2;transform:rotate(.7deg)}
.note-chip:nth-child(3n+1){background:#EEE9FD;border-color:#D6CCF7}

/* ---------- Forum ---------- */
.post{display:grid;gap:12px}
.post .meta{display:flex;gap:10px;align-items:center}
.post .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:.8rem}
.post .body-text{white-space:pre-wrap;line-height:1.8;font-size:.95rem;background:var(--surface-2);border-radius:12px;padding:14px 16px;max-height:280px;overflow:auto}
.comment{background:var(--blue-50);border-radius:12px;padding:10px 14px;font-size:.9rem}
textarea.input{resize:vertical;min-height:90px;line-height:1.6}

/* ---------- Paths ---------- */
.paths{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.path{border-radius:var(--r-lg);padding:22px;display:grid;gap:12px;align-content:start;border:2px solid transparent;cursor:pointer;transition:transform .15s,border-color .15s}
.path:hover{transform:translateY(-3px)}
.path.on{border-color:var(--blue)}

function inPath(id) { const p = AW_PATH_ONLY[id]; if (!p) return true; return p.includes(S.awPath || 1); }
function modOf(r) { if (r.startsWith('vocab')) return 'vocab'; if (r.startsWith('grammar')) return 'grammar'; if (r.startsWith('rca') || r.startsWith('wca')) return 'rca'; if (r.startsWith('aw')) return 'aw'; return 'home'; }
function track(m) { return ORDER[m].filter(id => m !== 'aw' || inPath(id)); }
function modProgress(m) { const t = track(m); const d = t.filter(id => S.done[id]).length; return { done: d, total: t.length, pct: Math.round(d / t.length * 100) }; }
function nextOf(id) { const m = modOf(id); const t = track(m); const i = t.indexOf(id); return i >= 0 && i < t.length - 1 ? t[i + 1] : null; }
function firstIncomplete(m, from) { const t = track(m); let i = from ? Math.max(0, t.indexOf(from)) : 0; for (let k = 0; k < t.length; k++) { const id = t[(i + k) % t.length]; if (!S.done[id]) return id; } return t[0]; }
function labelOf(id) {
  for (const m of Object.values(MODULES)) for (const it of m.items) { if (it.id === id) return it.label; if (it.sub) for (const s of it.sub) if (s.id === id) return s.label; }

}

/* ---------- Quiz runner: one question per screen ---------- */
function runQuiz(el, cfg) {
  const Q = cfg.questions, n = Q.length, assess = !!cfg.assessment;
  const st = { i: 0, ans: Array(n).fill(null), tries: Array(n).fill(0), res: Array(n).fill(null), t0: Date.now(), left: cfg.timeLimit || 0, over: false, hint: Array(n).fill(false) };
  if (assess) ACTIVE_ASSESS = true;
  const timer = setInterval(() => {
    if (st.over) return;
    if (cfg.timeLimit) { st.left--; if (st.left <= 0) { finish(true); return; } }
    const t = $('.timer', el); if (t) { t.querySelector('span').textContent = cfg.timeLimit ? fmtTime(st.left) + ' left' : fmtTime((Date.now() - st.t0) / 1000); t.classList.toggle('low', cfg.timeLimit && st.left < 60); }
  }, 1000);
  onLeave(() => clearInterval(timer));
  const L = 'ABCDEF';
  const correctOf = q => q.type === 'type' ? (Array.isArray(q.a) ? q.a[0] : q.a) : (q.type === 'yn' ? ['Yes', 'No'][q.a] : q.opts[q.a]);
  const isRight = (q, a) => q.type === 'type' ? [].concat(q.a).some(x => x.toLowerCase().trim() === String(a).toLowerCase().trim()) : a === q.a;

    if (q.type === 'bracket') return '';
    const opts = q.type === 'yn' ? ['Yes', 'No'] : q.opts;
    return `<div class="opts ${q.type === 'yn' ? 'yn' : ''}">${opts.map((o, k) => {
      let c = a === k ? 'sel' : '';
      if (locked && !assess) { if (k === q.a) c = 'right'; else if (a === k) c = 'wrong'; }
      return `<button class="opt ${c}" data-k="${k}" ${locked ? 'disabled' : ''}><span class="L">${q.type === 'yn' ? (k ? 'N' : 'Y') : L[k]}</span><span>${o}</span></button>`;
    }).join('')}</div>`;
  }
  function qText(q, i) {
    if (q.type !== 'bracket') return `<div class="qtext">${q.q}</div>`;
    const a = st.ans[i], locked = st.res[i] !== null;
    const b = `<span class="bopts">( ${q.opts.map((o, k) => { let c = a === k ? 'sel' : ''; if (locked && !assess) { if (k === q.a) c = 'right'; else if (a === k) c = 'wrong'; } return `<button class="bopt ${c}" data-k="${k}" ${locked ? 'disabled' : ''}>${o}</button>`; }).join(' / ')} )</span>`;
    return `<div class="qtext bracket">${q.q.replace('___', b)}</div>`;
  }
  function draw(fbHTML = '') {
    const i = st.i, q = Q[i], locked = st.res[i] !== null;
    const correct = st.res.filter(r => r === 'ok').length, revisitN = st.res.filter(r => r && r !== 'ok').length;
    el.innerHTML = `<div class="quiz">
      ${cfg.intro ? cfg.intro : ''}
      <div class="qbar"><span class="pill">Question ${i + 1} of ${n}</span><div class="progress" aria-label="Progress"><i style="width:${(st.res.filter(r => r !== null).length / n) * 100}%"></i></div>
        ${assess ? `<span class="chip-stat">${ICON.check.replace('<svg', '<svg width="14" height="14"')} ${st.res.filter(r => r !== null).length} answered</span>` : `<span class="chip-stat" style="color:var(--good-ink)">${ICON.check.replace('<svg', '<svg width="14" height="14"')} ${correct} correct</span><span class="chip-stat" style="color:var(--try-ink)">↺ ${revisitN} to revisit</span>`}
        <span class="chip-stat timer">${ICON.clock.replace('<svg', '<svg width="15" height="15"')} <span>${cfg.timeLimit ? fmtTime(st.left) + ' left' : fmtTime((Date.now() - st.t0) / 1000)}</span></span></div>
      <div class="qgrid">
        <div class="qcard">
          <div class="flex"><span class="qnum">Q${i + 1}.</span>${q.tag ? `<span class="pill violet">${esc(q.tag)}</span>` : ''}${q.level ? `<span class="pill aqua">${esc(q.level)}</span>` : ''}${assess ? '<span class="pill peach">Assessment</span>' : ''}</div>
          ${q.ctx ? `<div class="passage-box ctx">${q.ctx}</div>` : ''}
          ${qText(q, i)}
          ${optsHTML(q, i)}

            <div class="flex"><button class="btn" id="qSubmit" ${locked ? 'disabled' : ''}>Submit</button>
            <button class="btn soft" id="qNext">${i === n - 1 ? 'See my results' : 'Next'} ${ICON.arrowR.replace('<svg', '<svg width="16" height="16"')}</button></div></div>

            ${q.hint && (!assess || cfg.hintsInAssess) ? (st.hint[i] ? `<div class="hint"><b>Hint:</b> ${q.hint}</div>` : `<button class="btn soft sm" id="qHint" style="justify-self:start">${ICON.bulb.replace('<svg', '<svg width="15" height="15"')} Show a hint</button>`) : (assess ? `<p class="small muted">Hints are switched off during assessments.</p>` : '')}

      `<details class="card"><summary style="cursor:pointer;font-weight:500">Review every answer</summary><div class="tbl-wrap" style="margin-top:14px"><table class="tbl"><thead><tr><th>#</th><th>Question</th><th>Your answer</th><th>Correct answer</th><th>Result</th></tr></thead><tbody>${review}</tbody></table></div></details>`;

}

/* ---------- Drag-and-drop engine (mouse drag + tap-to-place) ---------- */
let CHIP_ID = 0;
function chipHTML(text, data = {}, cls = '') {

  return `<span class="chip ${cls}" draggable="true" data-id="c${++CHIP_ID}" ${attrs} tabindex="0" role="button">${text}</span>`;
}
function dnd(root, onChange = () => { }) {

    z.appendChild(c); unpick(); onChange();

  root.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('.chip'); if (!c || root.dataset.locked) { e.preventDefault(); return; } c.classList.add('dragging'); e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed = 'move'; });

  root.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('.zone'); if (!z) return; e.preventDefault(); z.classList.add('over'); });
  root.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('.zone'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('over'); });
  root.addEventListener('drop', e => { const z = e.target.closest && e.target.closest('.zone'); if (!z) return; e.preventDefault(); z.classList.remove('over'); const c = root.querySelector(`.chip[data-id="${e.dataTransfer.getData('text/plain')}"]`); if (c) place(c, z); });
  root.addEventListener('click', e => {
    if (root.dataset.locked) return;
    if (e.target.closest('.x')) return;

    if (c) { if (picked === c) { unpick(); return; } unpick(); picked = c; c.classList.add('picked'); return; }

}

/* ---------- Activity timer bar for drag/click tasks ---------- */

/* ---------- Sentence slots: drag the right word into each blank ---------- */
function runSlots(el, cfg) {

/* ---------- Writing area ---------- */
function highlightUsed(text, targets) {
  let h = esc(text);
  const sorted = targets.slice().sort((a, b) => b.length - a.length);
  for (const t of sorted) {
    const stem = t.length > 5 && !t.includes(' ') ? esc(t).replace(/(e|y)$/, '') : esc(t);
    const re = new RegExp(`\\b(${stem.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}[a-z]*)\\b`, 'gi');
    h = h.replace(re, '<mark>$1</mark>');
  }
  return h;
}
function usedTargets(text, targets) {
  const low = text.toLowerCase();
  return targets.filter(t => { const stem = t.length > 5 && !t.includes(' ') ? t.toLowerCase().replace(/(e|y)$/, '') : t.toLowerCase(); return new RegExp(`\\b${stem.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}`, 'i').test(low); });
}

function runVideo(el, cfg) {
  const D = cfg.duration, segs = cfg.segments;
  let t = 0, playing = false, speed = 1, iv = null, cur = -1;
  el.innerHTML = `<div class="video"><div class="player">
     <div class="screen" id="vScreen"><div id="vScene"></div><div class="caption" id="vCap"></div>

       <button class="btn ghost sm" id="vBack">−10s</button><button class="btn ghost sm" id="vFwd">+10s</button>
       <input type="range" id="vSeek" min="0" max="${D}" value="0" step="1" aria-label="Video progress"><span class="num small" id="vTime">00:00 / ${fmtTime(D)}</span>
       <label class="small muted" for="vSpd">Speed</label><select id="vSpd"><option value="1">1×</option><option value="1.5">1.5×</option><option value="2">2×</option><option value="4">4×</option></select></div>
     <div class="vctrl" style="border-top:1px solid var(--line);justify-content:space-between"><span class="small"><span class="pill">${esc(cfg.topic)}</span> <span class="pill violet">${esc(cfg.sub)}</span></span><span class="pill proto">Prototype: animated lesson placeholder</span></div>
   </div>
   <aside class="side-panel"><div class="card stack"><h4>Chapters</h4><div class="chapters">${segs.map((s, k) => `<button class="chap" data-k="${k}"><span class="tm">${fmtTime(s.t)}</span><span>${esc(s.title)}</span></button>`).join('')}</div></div>
   <div class="card stack"><div class="row-between"><h4>Watched</h4><b class="num" id="vPct">0%</b></div><div class="bar" style="background:var(--line-2);color:var(--blue)"><i id="vBar" style="width:0%"></i></div>
   <button class="btn ghost sm" id="vDone" style="justify-self:start">Mark as watched</button><div id="vMsg"></div></div></aside></div>`;
  let maxT = 0;
  function seg(tt) { let k = 0; segs.forEach((s, i) => { if (tt >= s.t) k = i; }); return k; }
  function paint() {
    const k = seg(t);
    if (k !== cur) { cur = k; $('#vScene', el).innerHTML = `<div class="scene">${segs[k].art}</div>`; $$('.chap', el).forEach((c, i) => c.classList.toggle('on', i === k)); }
    $('#vCap', el).textContent = segs[k].cap; $('#vSeek', el).value = t; $('#vTime', el).textContent = `${fmtTime(t)} / ${fmtTime(D)}`;
    maxT = Math.max(maxT, t); const p = Math.round(maxT / D * 100); $('#vPct', el).textContent = p + '%'; $('#vBar', el).style.width = p + '%';
  }
  function setPlay(p) {
    playing = p; $('#vOver', el).hidden = p;
    $('#vPlay', el).innerHTML = (p ? ICON.pause : ICON.play).replace('<svg', '<svg width="16" height="16"'); $('#vPlay', el).setAttribute('aria-label', p ? 'Pause' : 'Play');
    clearInterval(iv); if (p) iv = setInterval(() => { t = Math.min(D, t + 0.25 * speed); paint(); if (t >= D) { setPlay(false); finish(); } }, 250);
  }
  function finish() { if (!S.done[cfg.id]) complete(cfg.id, null); $('#vMsg', el).innerHTML = `<div class="feedback good" style="margin-top:6px"><b>Lesson watched.</b><span>${cfg.after || ''}</span></div>${nextBar(cfg.id)}`; }
  onLeave(() => clearInterval(iv));
  $('#vOver', el).onclick = () => setPlay(true);
  $('#vPlay', el).onclick = () => setPlay(!playing);
  $('#vBack', el).onclick = () => { t = Math.max(0, t - 10); paint(); };
  $('#vFwd', el).onclick = () => { t = Math.min(D, t + 10); paint(); };
  $('#vSeek', el).oninput = e => { t = +e.target.value; paint(); };
  $('#vSpd', el).onchange = e => { speed = +e.target.value; };
  $$('.chap', el).forEach(c => c.onclick = () => { t = segs[+c.dataset.k].t; paint(); if (!playing) setPlay(true); });
  $('#vDone', el).onclick = () => { maxT = D; paint(); finish(); };
  paint();
  if (S.done[cfg.id]) $('#vMsg', el).innerHTML = `<p class="small muted" style="margin-top:6px">Already watched. Replay any chapter for revision.</p>${nextBar(cfg.id)}`;
}

/* ---------- Worksheet: preview + real PDF via jsPDF + downloads capability ---------- */
function worksheetPDF(ws, withKey) {
  if (!window.jspdf) return null;
  const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, M = 16; let y = 18;
  const line = (h = 6) => { y += h; if (y > 278) { doc.addPage(); y = 20; } };
  doc.setFillColor(234, 240, 255); doc.rect(0, 0, W, 34, 'F');
  doc.setTextColor(43, 50, 71); doc.setFont('helvetica', 'bold'); doc.setFontSize(17); doc.text(ws.title, M, y); line(7);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(90, 98, 122);
  doc.text(`${ws.topic}  |  ${ws.sub}  |  ${ws.grade}  |  RCA 2.0 – WCA`, M, y); y = 44;
  doc.setTextColor(43, 50, 71);
  doc.text('Name: ______________________    Class: ______    Date: ____________', M, y); line(10);
  ws.sections.forEach(sec => {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.text(sec.h, M, y); line(6);
    doc.setFont('helvetica', 'italic'); doc.setFontSize(10); doc.splitTextToSize(sec.instr, W - 2 * M).forEach(l => { doc.text(l, M, y); line(5); }); line(1);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(11);
    sec.items.forEach((it, k) => { doc.splitTextToSize(`${k + 1}. ${it}`, W - 2 * M - 4).forEach((l, j) => { doc.text(l, M + (j ? 4 : 0), y); line(6); }); line(1.5); });
    line(4);
  });
  if (withKey) {
    doc.addPage(); y = 20; doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.text('Answer key (teacher/admin copy)', M, y); line(9);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5);
    ws.key.forEach(k => { doc.splitTextToSize(k, W - 2 * M).forEach(l => { doc.text(l, M, y); line(5.5); }); line(1); });
  }
  const pages = doc.getNumberOfPages();
  for (let p = 1; p <= pages; p++) { doc.setPage(p); doc.setFontSize(8.5); doc.setTextColor(138, 145, 166); doc.text(`© RCA 2.0 – WCA · EKSAQ · Prototype worksheet · Page ${p} of ${pages}`, M, 290); }
  return doc.output('blob');
}
async function offerFile(filename, blob) {
  if (!blob) { toast('The PDF tool did not load. Use the preview instead.'); return; }
  try {
    if (window.claude && window.claude.use) {
      const dl = await window.claude.use('downloads');
      if (dl) { await dl.save({ filename, data: blob }); toast('Worksheet saved'); return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    toast('Download started');
  } catch (e) {
    if (e && e.code === 'declined') toast('Download cancelled'); else toast('Downloads are not available in this view. Use Preview worksheet instead.');
  }
}

function analyseLetter(text, min = 150, max = 200) {

    'Date': /\b\d{1,2}(st|nd|rd|th)?\s+(january|february|march|april|may|june|july|august|september|october|november|december)\s+\d{4}\b|\b\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}\b/i.test(t),
    'Receiver’s address': /\b(the editor|the principal|the commissioner|the municipal|the manager|to,?\s*$)/im.test(t),
    'Subject line': /^\s*subject\s*[:–-]/im.test(t),
    'Formal salutation': /^\s*(dear\s+)?(sir|madam|sir\/madam|respected)/im.test(t),
    'Complimentary close': /yours (faithfully|sincerely|truly)/i.test(t),
    'Name/signature': /yours (faithfully|sincerely|truly)[,.]?\s*\n+\s*\S+/i.test(t)

  const paras = t.split(/\n\s*\n/).filter(p => wordCount(p) > 18).length;

  const C = [

    { k: 'Content and ideas', s: lvl(ideas, 2, 4, 6), good: 'The problem is explained clearly and practical suggestions are offered.', fix: 'State the problem in one paragraph, then give two clear, practical suggestions and a polite request for action.' },
    { k: 'Organisation', s: lvl(paras, 1, 2, 3), good: 'Body paragraphs move logically from the problem to the solution.', fix: 'Use three body paragraphs: introduce the issue, explain its effects, suggest solutions.' },
    { k: 'Formal tone', s: Math.max(1, 4 - Math.min(3, contr + infl)), good: 'The language is polite, formal and free of slang.', fix: `Replace contractions and informal words${contr ? ` (${contr} contraction${contr > 1 ? 's' : ''} found)` : ''} with full forms, e.g. “do not” instead of “don’t”.` },

   <div class="grid g2"><div class="card tint-mint stack"><h4>Strengths</h4><ul class="fb-list small">${(strong.length ? strong : A.C.slice(0, 1)).slice(0, 3).map(c => `<li>${c.good}</li>`).join('')}</ul></div>

function speak(text) {
  try {
    if (!window.speechSynthesis) throw 0;
    speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'en-GB'; u.rate = .85;
    const v = speechSynthesis.getVoices().find(v => /en-GB/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /^en/i.test(v.lang)); if (v) u.voice = v;
    speechSynthesis.speak(u); return true;
  } catch (e) { toast('Audio is not supported in this browser. Use the text clue instead.'); return false; }
}

VIEWS['grammar-explain'] = main => {
  const toc = [['intro', 'Introducing the first conditional'], ['use', 'What it expresses'], ['form', 'The structure'], ['examples', 'Examples in context'], ['order', 'Order and the comma'], ['error', 'A common error'], ['vary', 'Other forms and “unless”'], ['likely', 'How likely is the result?'], ['compare', 'Zero or first?'], ['recap', 'Recap']];
  main.innerHTML = `<div class="page">${gHead('Written Explanation', 'A digital textbook chapter. Scroll through the sections or jump to any of them.')}
  <div class="book"><nav class="toc" aria-label="Sections">${toc.map(([id, t]) => `<a href="#" data-sec="${id}">${t}</a>`).join('')}<div class="meter" style="height:6px;border-radius:6px;background:var(--line-2);overflow:hidden;margin-top:8px"><i id="readbar" style="display:block;height:100%;width:0;background:var(--violet-ink)"></i></div></nav>
  <article class="textbook" id="tb">
   <section id="sec-intro"><span class="eyebrow">Conditionals · Sub-concept 3</span><h1>The First Conditional</h1>
    <p class="lead">Every day, people make plans that depend on something else. A picnic depends on the weather; a good result depends on preparation. English has a special structure for talking about these <b>real possibilities in the future</b>: the <span class="kw">first conditional</span>.</p>
    <p>Before looking at its parts, it helps to recall what a conditional sentence is. A conditional sentence joins two ideas: a <b>condition</b>, introduced by <i>if</i>, and a <b>result</b> that depends on that condition. The first conditional is one particular type – the one used when the condition is genuinely likely to happen.</p></section>
   <section id="sec-use"><h2>What it expresses</h2>
    <p>The first conditional describes a situation that <b>may really happen</b> in the future, together with its <b>probable result</b>. The speaker believes the condition is possible – not certain, but realistic.</p>
    <figure class="figure"><svg width="520" height="190" viewBox="0 0 520 190" role="img" aria-label="If it rains, I will take an umbrella"><rect x="10" y="20" width="230" height="150" rx="16" fill="#ECE6FD"/><rect x="280" y="20" width="230" height="150" rx="16" fill="#DAF4F2"/><ellipse cx="125" cy="70" rx="56" ry="24" fill="#fff"/><circle cx="96" cy="66" r="22" fill="#fff"/><circle cx="152" cy="62" r="20" fill="#fff"/><g stroke="#4A6FD6" stroke-width="4" stroke-linecap="round"><path d="M98 104l-6 14M126 104l-6 14M154 104l-6 14"/></g><text x="125" y="155" text-anchor="middle" font-family="Lexend,sans-serif" font-size="15" fill="#6450C4">Condition: If it rains,</text><path d="M246 95h28" stroke="#5A627A" stroke-width="3"/><path d="m268 88 8 7-8 7" fill="none" stroke="#5A627A" stroke-width="3"/><path d="M345 92a50 50 0 0 1 100 0z" fill="#4A6FD6"/><path d="M395 92v40a10 10 0 0 1-20 0" fill="none" stroke="#2B3247" stroke-width="4"/><text x="395" y="155" text-anchor="middle" font-family="Lexend,sans-serif" font-size="15" fill="#1F7F79">Result: I will take an umbrella.</text></svg><figcaption>Figure 1. The condition comes first in time; the result follows.</figcaption></figure></section>
   <section id="sec-form"><h2>The structure</h2>
    <div class="rule"><span class="eyebrow">Grammar rule</span><span class="f">If + present simple, will + base verb</span><span class="small">The <b>if-clause</b> uses the present simple. The <b>main clause</b> uses <i>will</i> followed by the base form of the verb.</span></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>If-clause (condition)</th><th>Main clause (result)</th><th>Complete sentence</th></tr></thead><tbody>
     <tr><td>If + <b>present simple</b></td><td><b>will</b> + base verb</td><td>—</td></tr>
     <tr><td>If Meera <b>wakes</b> up early,</td><td>she <b>will catch</b> the sunrise.</td><td>If Meera wakes up early, she will catch the sunrise.</td></tr>
     <tr><td>If the shops <b>close</b> at eight,</td><td>we <b>will go</b> now.</td><td>If the shops close at eight, we will go now.</td></tr>
     <tr><td>If it <b>does not rain</b>,</td><td>the farmers <b>will worry</b>.</td><td>If it does not rain, the farmers will worry.</td></tr></tbody></table></div>
    <p>Notice that the present simple in the if-clause refers to the <i>future</i>. This is one of the interesting features of English: the time meaning comes from the whole sentence, not from the verb alone.</p></section>
   <section id="sec-examples"><h2>Examples in context</h2>
    <div class="ex"><span class="s">If the monsoon <b>arrives</b> on time, the farmers <b>will sow</b> their paddy next week.</span><span class="small muted">A realistic plan that depends on the weather.</span></div>
    <div class="ex"><span class="s">If Aditya <b>revises</b> every evening, he <b>will feel</b> confident on exam day.</span><span class="small muted">A likely result of regular effort.</span></div>
    <div class="ex"><span class="s">If we <b>do not leave</b> by seven, we <b>will miss</b> the train to Warangal.</span><span class="small muted">A negative condition with a clear consequence.</span></div></section>
   <section id="sec-order"><h2>Order and the comma</h2>
    <p>The two clauses can appear in either order without changing the meaning. Only the punctuation changes.</p>
    <div class="grid g2"><div class="ex"><span class="s">If you call me, I will answer.</span><span class="small">If-clause first → <b>comma</b> after it.</span></div><div class="ex"><span class="s">I will answer if you call me.</span><span class="small">Main clause first → <b>no comma</b>.</span></div></div></section>
   <section id="sec-error"><h2>A common error</h2>
    <div class="note"><b>Avoid “will” in the if-clause.</b><br><span style="text-decoration:line-through">If it will rain, we will stay home.</span> → <b>If it rains, we will stay home.</b><br>The present simple already carries the future meaning, so a second <i>will</i> is not needed.</div></section>
   <section id="sec-vary"><h2>Other forms and “unless”</h2>
    <p>The main clause does not always use <i>will</i>. Writers choose other forms to show how sure they are, or to give instructions.</p>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Main clause form</th><th>Meaning</th><th>Example</th></tr></thead><tbody>
     <tr><td><b>can</b> + base verb</td><td>possibility or permission</td><td>If you finish early, you <b>can leave</b>.</td></tr>
     <tr><td><b>may / might</b> + base verb</td><td>a less certain result</td><td>If it gets cloudy, we <b>might postpone</b> the trek.</td></tr>
     <tr><td><b>imperative</b></td><td>an instruction</td><td>If you see Riya, <b>tell</b> her about the meeting.</td></tr></tbody></table></div>
    <div class="rule"><span class="eyebrow">Unless = if … not</span><span class="f" style="font-size:1.05rem">Unless you hurry, you will miss the bus.</span><span class="small">= If you do <b>not</b> hurry, you will miss the bus. Since <i>unless</i> already contains the idea of “not”, the clause after it stays positive.</span></div></section>
   <section id="sec-likely"><h2>How likely is the result?</h2>
    <p>Comparing the main conditional types shows where the first conditional sits. The graph shows how real each situation is.</p>
    <figure class="figure"><svg width="520" height="230" viewBox="0 0 520 230" role="img" aria-label="Likelihood graph of conditional types"><line x1="120" y1="20" x2="120" y2="190" stroke="#C9D1E3"/><g font-family="Lexend,sans-serif" font-size="13" fill="#5A627A"><text x="110" y="52" text-anchor="end">Zero</text><text x="110" y="92" text-anchor="end">First</text><text x="110" y="132" text-anchor="end">Second</text><text x="110" y="172" text-anchor="end">Third</text><text x="120" y="215">0%</text><text x="300" y="215" text-anchor="middle">50%</text><text x="480" y="215" text-anchor="end">100%</text></g>
     <rect x="121" y="36" width="359" height="24" rx="6" fill="#A6DCD5"/><rect x="121" y="76" width="260" height="24" rx="6" fill="#6450C4"/><rect x="121" y="116" width="70" height="24" rx="6" fill="#CFC3F6"/><rect x="121" y="156" width="6" height="24" rx="3" fill="#E1E6F3"/>
     <g font-family="Lexend,sans-serif" font-size="12" fill="#2B3247"><text x="470" y="53" text-anchor="end">always true</text><text x="390" y="93">real possibility</text><text x="200" y="133">unlikely / imaginary</text><text x="136" y="173">past – did not happen</text></g></svg><figcaption>Figure 2. The first conditional describes real, likely outcomes (illustrative scale).</figcaption></figure></section>
   <section id="sec-compare"><h2>Zero or first?</h2>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th></th><th>Zero conditional</th><th>First conditional</th></tr></thead><tbody>
     <tr><td><b>Use</b></td><td>facts, general truths</td><td>a specific, possible future event</td></tr>
     <tr><td><b>Form</b></td><td>If + present, present</td><td>If + present, will + base verb</td></tr>
     <tr><td><b>Example</b></td><td><i>If you heat ice, it melts.</i></td><td><i>If you heat the soup now, it will be ready by lunch.</i></td></tr></tbody></table></div></section>
   <section id="sec-recap" class="recap"><h2>Recap</h2><ul>
    <li>The first conditional describes <b>real, possible situations in the future</b> and their likely results.</li>
    <li>Structure: <b>If + present simple, will + base verb</b>.</li>
    <li>When the if-clause comes first, use a <b>comma</b>; when it comes second, no comma is needed.</li>
    <li><i>Will</i> does not appear in the if-clause.</li>
    <li><i>Can, may, might</i> or an instruction can replace <i>will</i>; <b>unless</b> means <i>if … not</i>.</li></ul>
    <button class="btn mint" id="readDone" style="margin-top:12px">I have read this explanation</button></section>

}

  <div class="grid g2"><div class="instr">${ICON.info}<div><b>How to comment:</b> Use <b>two stars and a wish</b> – two things the writer did well and one specific suggestion. Refer to the rubric: structure, dialogue, show not tell, reactions and sequencing. Comments need at least 12 words.</div></div>
  <div class="instr" style="background:var(--mint)">${ICON.shield.replace('<svg', '<svg style="color:var(--mint-ink)"')}<div><b style="color:var(--mint-ink)">Privacy and safety:</b> Writers are shown as Writer A, B and C. Names, schools and photos are never shared. Comments are checked by teachers before writers see them. Be kind, specific and helpful.</div></div></div>
  <div class="grid g3">${posts.map((p, k) => { const mine = S.forum[key][k] || []; return `<article class="card post"><div class="meta"><span class="av" style="background:${p.av[0]};color:${p.av[1]}">${p.who.split(' ')[1]}</span><div><b>${p.who}</b><span class="small muted" style="display:block">${p.meta} · ${wordCount(p.text)} words</span></div></div>
     <div class="body-text">${esc(p.text)}</div>
     <div class="stack" style="gap:8px">${p.comments.map(c => `<div class="comment"><b class="small">${c.by}</b><br>${esc(c.t)}</div>`).join('')}${mine.map(c => `<div class="comment" style="background:var(--mint)"><b class="small">You · awaiting teacher check</b><br>${esc(c)}</div>`).join('')}</div>
     <label class="small" for="fc-${k}"><b>Your feedback</b></label><textarea class="input" id="fc-${k}" placeholder="⭐ … ⭐ … Wish: …"></textarea><div class="row-between"><span class="small muted" id="fcw-${k}">0 words</span><button class="btn sm" data-post="${k}">Submit feedback</button></div></article>`; }).join('')}</div>
  <div id="fmsg"></div>${nextBar(next)}</div>`;
  $$('textarea', main).forEach(t => t.oninput = () => { const k = t.id.split('-')[1]; $('#fcw-' + k).textContent = wordCount(t.value) + ' words'; });
  $$('[data-post]', main).forEach(b => b.onclick = () => {
    const k = b.dataset.post, t = $('#fc-' + k), v = t.value.trim();
    if (wordCount(v) < 12) { toast('Write at least 12 words of constructive feedback'); return; }
    if (/stupid|bad writer|useless|hate/i.test(v)) { toast('Please rephrase kindly – focus on the writing, not the writer'); return; }
    (S.forum[key][k] = S.forum[key][k] || []).push(v); save();
    const done = posts.every((_, j) => (S.forum[key][j] || []).length);
    if (done && !S.done[next]) { complete(next); toast('Feedback given on all three submissions'); } else toast('Feedback submitted');
    render();
  });
}

VIEWS['wca-guide'] = main => {
  main.innerHTML = `<div class="page">${pageHead({ crumbs: ['RCA – WCA', 'WCA', 'Step-by-Step Guidance'], title: 'Step-by-Step Guidance', desc: 'Everything needed to write a strong narrative, in one place.', right: '<span class="pill violet">Genre: Narrative</span>' })}
  <article class="textbook" style="max-width:none">
   <section><span class="eyebrow">Writing genre</span><h1>Writing a Narrative Story</h1><p class="lead">A narrative takes the reader on a journey. Good narratives are not simply a list of events; they <span class="u">make the reader feel present</span> in the story through structure, voice and vivid detail.</p></section>
   <section><h2>Step 1 · Plan with the story mountain</h2><div class="split"><figure class="figure"><svg width="440" height="200" viewBox="0 0 440 200" role="img" aria-label="Story mountain diagram"><path d="M20 170 140 120 220 40 310 110 420 170" fill="none" stroke="#6450C4" stroke-width="5" stroke-linejoin="round"/><g fill="#ECE6FD" stroke="#6450C4" stroke-width="2"><circle cx="20" cy="170" r="7"/><circle cx="140" cy="120" r="7"/><circle cx="220" cy="40" r="9"/><circle cx="310" cy="110" r="7"/><circle cx="420" cy="170" r="7"/></g><g font-family="Lexend,sans-serif" font-size="12.5" fill="#2B3247"><text x="8" y="192">1 Exposition</text><text x="104" y="104">2 Rising action</text><text x="190" y="24">3 Climax</text><text x="300" y="96">4 Falling action</text><text x="350" y="192">5 Resolution</text></g></svg><figcaption>The story mountain: tension rises to the climax, then settles.</figcaption></figure>
     <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Stage</th><th>Purpose</th><th>In the Olympic story</th></tr></thead><tbody><tr><td><b>Beginning</b></td><td>Hook, characters, setting</td><td>Finding the coin; arriving in Olympia</td></tr><tr><td><b>Middle</b></td><td>Conflict, rising tension, climax</td><td>Meeting Nikos; the stadion race</td></tr><tr><td><b>End</b></td><td>Resolution, reflection</td><td>Returning home; what it meant</td></tr></tbody></table></div></div></section>
   <section><h2>Step 2 · Open with a hook</h2><p>The first line decides whether a reader continues. Strong openings start <i>in the middle of action</i>, with <i>dialogue</i>, or with a <i>striking image</i>.</p><div class="grid g3"><div class="ex"><span class="small eyebrow">Action</span><span class="s">The coin slipped from my fingers – and the floor vanished.</span></div><div class="ex"><span class="small eyebrow">Dialogue</span><span class="s">“Run!” someone shouted, pulling me into the crowd.</span></div><div class="ex"><span class="small eyebrow">Image</span><span class="s">Dust hung in the air like golden smoke.</span></div></div></section>
   <section><h2>Step 3 · Punctuate dialogue correctly</h2><div class="rule"><span class="eyebrow">Convention</span><span class="f" style="font-size:1.1rem">“Spoken words,” said the speaker, “go inside inverted commas.”</span></div><ul><li>Begin a <b>new line</b> for each new speaker.</li><li>Punctuation at the end of speech goes <b>inside</b> the closing inverted comma.</li><li>Use varied reporting verbs – <i>whispered, called, stammered</i> – but do not overuse them.</li></ul></section>
   <section><h2>Step 4 · Show, do not tell</h2><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Telling</th><th>Showing</th></tr></thead><tbody><tr><td>I was nervous.</td><td>My palms grew damp and my heart hammered against my ribs.</td></tr><tr><td>It was hot.</td><td>Heat rose from the track in shimmering waves.</td></tr><tr><td>The crowd was excited.</td><td>The crowd stamped and roared until the ground trembled.</td></tr></tbody></table></div></section>
   <section><h2>Step 5 · Sequence events clearly</h2><p>Time connectives act as <b>signposts</b>. Vary them so the story flows: <span class="kw">At first</span> <span class="kw">Moments later</span> <span class="kw">Meanwhile</span> <span class="kw">Just then</span> <span class="kw">By the time</span> <span class="kw">Finally</span>.</p>
    <figure class="figure"><svg width="520" height="150" viewBox="0 0 520 150" role="img" aria-label="How tension changes across a narrative"><path d="M30 120h470M30 120V20" stroke="#C9D1E3" stroke-width="2"/><polyline points="40,110 120,95 200,78 280,50 330,30 380,70 470,100" fill="none" stroke="#1F7F79" stroke-width="4"/><g font-family="Lexend,sans-serif" font-size="11" fill="#5A627A"><text x="34" y="138">Opening</text><text x="300" y="138">Climax</text><text x="440" y="138">Ending</text><text x="0" y="24" transform="rotate(-90 12 70)">Tension</text></g></svg><figcaption>Tension builds steadily, peaks at the climax and eases in the ending.</figcaption></figure></section>
   <section class="recap"><h2>Quick reference</h2><ul><li><b>Structure:</b> beginning, middle with a climax, end.</li><li><b>Dialogue:</b> inverted commas, new line per speaker.</li><li><b>Show, not tell:</b> actions, the body, the five senses.</li><li><b>Reactions:</b> how characters respond at key moments.</li><li><b>Sequence:</b> varied time connectives.</li></ul><button class="btn mint" id="gdone" style="margin-top:12px">I have read the guidance</button></section>
  </article>${nextBar('wca-guide')}</div>`;

const FACE = (a, b) => `<svg viewBox="0 0 40 40" aria-hidden="true"><rect x="7" y="9" width="26" height="22" rx="9" fill="#fff" stroke="${b}" stroke-width="2"/><circle cx="15.5" cy="19" r="2.4" fill="${b}"/><circle cx="24.5" cy="19" r="2.4" fill="${b}"/><path d="M15 25q5 3.5 10 0" stroke="${b}" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M20 9V5" stroke="${b}" stroke-width="2"/><circle cx="20" cy="4" r="2" fill="${a}"/></svg>`;

      ['Where are my unfinished lessons?', () => { const u = allUnfinished(); return { t: u.length ? `Here is where each course picks up:<br>${u.map(x => `• <b>${MODULES[x.m].name}</b>: ${labelOf(x.id)} (${x.left} left)`).join('<br>')}` : 'You have completed every tracked activity!', go: u[0] && u[0].id }; }],
      ['How am I doing this week?', () => { const w = Object.values(S.week).filter(Boolean).length; return { t: `You have a <b>${S.stats.streak}-day streak</b>, ${S.stats.days} learning days in total and <b>${w} of 4</b> courses attempted this week. You are ${S.stats.days - 38} days ahead of your class average.`, go: 'home' }; }],
      ['How do drag-and-drop activities work?', () => ({ t: 'Drag a chip from the word bank into a blank or box. On a phone or tablet, tap the chip first and then tap where it should go. To move a chip back, tap it and then tap the word bank.' })],

function hintFor(m) {
